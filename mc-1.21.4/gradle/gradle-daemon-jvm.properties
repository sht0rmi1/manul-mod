# Какой JDK брать демону Gradle.
#
# Нужно потому, что `java` в PATH здесь — обёртка Oracle, сообщающая о себе
# каталог C:\Program Files\Java\jdk-21.0.12.1, в котором нет bin\java.exe.
# Без этого файла Gradle берёт JDK «тот же, что у себя» и падает с
# «The supplied javaHome seems to be invalid» ещё до первой задачи.
#
# Версия та же, что у toolchain в build.gradle: JDK 25 (Minecraft 26.2).
toolchainVersion=25
