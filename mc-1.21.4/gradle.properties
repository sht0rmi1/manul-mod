# Больше памяти для Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric для Minecraft 1.21.4
minecraft_version=1.21.4
loader_version=0.16.10
# Loom 1.17 требует, чтобы access widener'ы Fabric API были в official-namespace,
# а Fabric API для 1.21.4 ещё выпускался с intermediary. Отсюда версия постарее.
loom_version=1.13.6

# Свойства мода
version=1.0.0-mc1.21.4
group=com.sht0rmi
archives_base_name=manul

# Зависимости
fabric_api_version=0.119.4+1.21.4

# Где искать JDK 21 для запуска игры (см. блок AbstractRunTask в build.gradle).
# Без этой строки Gradle может не найти установленный JDK и полезет качать свой.
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.12
